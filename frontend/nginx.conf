# Template: ${DPDS_FRONTEND_BIND}, ${DPDS_FRONTEND_PORT} and ${DPDS_CONTROLLER} are substituted by the nginx
# image's entrypoint. DPDS_CONTROLLER is http://host:port without a path (nginx forwards the request URI as is).
gzip on;
gzip_types text/css application/javascript text/javascript application/json;

server {
    listen ${DPDS_FRONTEND_BIND}:${DPDS_FRONTEND_PORT};
    root /usr/share/nginx/html;
    index index.html;

    # The controller is same-origin for the browser (no CORS needed). The browser's Host header is passed on
    # so the controller's DNS-rebinding guard (--allowed-host) also protects this path.
    location /api/ {
        proxy_pass ${DPDS_CONTROLLER};
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Vite hashes the file names in /assets/, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry page names the hashed assets, so the browser must revalidate it (also reached by the SPA fallback).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
