# CI: formatting, clippy and tests for the Rust workspace, the web frontend and dpds.sh, plus the
# frontend build that dpds.sh install downloads.
name: CI

on:
  push:
    branches: [nightly, main, master]
  pull_request:

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned so a new stable release (new clippy lints, rustfmt changes) can't turn CI red on an
      # unchanged tree; bump deliberately together with dpds-core's rust-version note.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    runs-on: ubuntu-24.04 # 4 vCPUs on public repositories; the e2e tests need 4
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Plain build instead of the repository's default (.cargo/config.toml: target-cpu=native,
      # linker-plugin-lto, lld). That setup needs a clang/lld with the same LLVM major as rustc;
      # CI wants none of it, the tests do not depend on cross-language LTO. RUSTFLAGS and
      # RUSTDOCFLAGS from the environment replace `build.rustflags` / `build.rustdocflags` from
      # the config file even when empty (the doctests of dpds-core are linked by rustdoc, hence
      # RUSTDOCFLAGS too).
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
      # dpdk-sys/build.rs compiles the bindgen wrappers with clang LTO objects when `clang` is on
      # PATH and CC is unset. CC=gcc selects its plain-compiler fallback. It also adds
      # -march=native, which would bake the CPU of whichever runner built a cached target
      # directory into the wrappers; CFLAGS comes last on the command line and wins.
      CC: gcc
      CFLAGS: -march=x86-64-v2
    steps:
      - uses: actions/checkout@v7

      # libclang-dev: bindgen. libpcap-dev: libdpdk.pc requires libpcap, and the net_pcap vdev of
      # the e2e tests links it. The rest is only needed to build DPDK on a cache miss.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libpcap-dev pkg-config meson ninja-build python3-pyelftools

      # The Ubuntu 24.04 package is DPDK 23.11 (25.11 on 26.04); dpdk-sys needs >= 25.11 and the
      # project is developed against 26.07, so DPDK is built from the release tarball. The install
      # is cached on the hash of the script, which holds the version and all build options.
      - name: Restore DPDK
        id: dpdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/dpdk
          key: dpdk-ubuntu-24.04-${{ hashFiles('.github/scripts/install-dpdk.sh') }}
      - name: Build DPDK
        if: steps.dpdk-cache.outputs.cache-hit != 'true'
        run: .github/scripts/install-dpdk.sh "$HOME/dpdk"
      # Saved right after the build, not at the end of the job: red tests must not cost a DPDK
      # build on every rerun.
      - name: Save DPDK
        if: steps.dpdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/dpdk
          key: ${{ steps.dpdk-cache.outputs.cache-primary-key }}
      - name: Use DPDK
        run: |
          echo "PKG_CONFIG_PATH=$HOME/dpdk/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/dpdk/lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `telemetry` (crate dpds) is the only feature that changes code paths, the others of
      # dpds-core are on by default. All features is a second pass over the telemetry code.
      - name: Clippy, all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --release as in the README ("Testing & Automation"): the controller's e2e tests need a
      # release `dpds` anyway, and the e2e timings are meant for the release profile.
      # --no-fail-fast reports every failing test binary, not just the first.
      # The dpds e2e tests start the real binary on net_null/net_pcap vdevs without root or
      # hugepages. They need up to 4 CPUs (`-l 0-3`) and serialise themselves with a lock.
      - name: Test
        run: cargo test --workspace --release --no-fail-fast
      - name: Test dpds with telemetry
        run: cargo test -p dpds --release --features telemetry --no-fail-fast
      # The controller's end-to-end tests are #[ignore]d: they supervise a real `dpds` with
      # telemetry, so that binary is built first. They run one at a time.
      - name: Build dpds with telemetry
        run: cargo build --release -p dpds --features telemetry
      - name: Test controller end-to-end
        run: cargo test --release -p dpds-controller --test integration -- --ignored --test-threads=1

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Node 22; package.json allows >= 18.18.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run

  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Plain bash with stubbed cargo/curl/systemctl; no root or real systemd needed.
      - run: bash packaging/tests/dpds_sh.test.sh

  # The frontend asset is built and published by two jobs, so that the job with write access runs
  # no checkout and no npm: the build job (read-only token) runs the build tooling and hands the
  # two files over as a workflow artifact, the publish job (the only one that may write) moves them
  # into the release. `dpds.sh install` downloads the asset of the checked-out frontend/ tree and
  # builds the controller with it. The asset is named after the git tree hash of frontend/, so a
  # push that does not touch frontend/ finds its asset already there and uploads nothing.
  frontend-asset-build:
    needs: frontend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      asset: ${{ steps.package.outputs.asset }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package
        id: package
        run: |
          tree=$(git rev-parse HEAD:frontend)
          asset="dpds-frontend-$tree.tar.gz"
          mkdir "$RUNNER_TEMP/assets"
          tar -C frontend/dist -czf "$RUNNER_TEMP/assets/$asset" .
          # Checked by `sha256sum -c` next to the tarball, so the file name has no directory.
          (cd "$RUNNER_TEMP/assets" && sha256sum "$asset" > "$asset.sha256")
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-asset
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 1

  # Publishes the two files of the build job to the prerelease `frontend-builds`. The release must
  # not be called `nightly`: that is a branch name. Only this job may write.
  frontend-asset-publish:
    needs: frontend-asset-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/nightly' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ASSET: ${{ needs.frontend-asset-build.outputs.asset }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frontend-asset
          path: ${{ runner.temp }}/assets
      - name: Publish
        run: |
          dir="$RUNNER_TEMP/assets"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/frontend-builds"
          # The release is created once. If another run creates it first, the create fails and view succeeds.
          gh release view frontend-builds --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create frontend-builds --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
                 --title "Frontend builds" \
                 --notes "Built frontend/dist per frontend/ tree hash, downloaded by dpds.sh install. Created by CI." \
            || gh release view frontend-builds --repo "$GITHUB_REPOSITORY" > /dev/null
          # Whether a file exists is asked of the public download URL (HEAD request: 302 if it
          # exists, 404 if not). Listing the release assets would stop at about 100 of them.
          # The two files are uploaded one after the other (two commands), tarball first; a
          # failed run can leave the tarball without its checksum file, which the next run repairs.
          # --clobber replaces a half-uploaded file of an earlier failed run.
          if ! curl -fsI -o /dev/null "$base/$ASSET"; then
            gh release upload frontend-builds "$dir/$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
            gh release upload frontend-builds "$dir/$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          elif ! curl -fsI -o /dev/null "$base/$ASSET.sha256"; then
            echo "$ASSET already exists, but its .sha256 file is missing: uploading the .sha256 file."
            gh release upload frontend-builds "$dir/$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "$ASSET and its .sha256 file already exist in the release, nothing to upload."
          fi
