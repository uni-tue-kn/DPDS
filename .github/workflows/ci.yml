# CI: formatting, clippy and tests for the Rust workspace, the web frontend (including the build
# that dpds.sh runs) and dpds.sh.
name: CI

on:
  push:
    branches: [nightly, main, master]
  pull_request:

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04 # 4 vCPUs on public repositories; the e2e tests need 4
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      # Plain build instead of .cargo/config.toml (target-cpu=native, linker-plugin-lto, lld), which
      # needs a clang/lld of rustc's LLVM major; the tests do not need cross-language LTO. Empty
      # RUSTFLAGS/RUSTDOCFLAGS still replace the config's `build.rustflags`/`build.rustdocflags`
      # (rustdoc links the dpds-core doctests).
      RUSTFLAGS: ""
      RUSTDOCFLAGS: ""
      # dpdk-sys/build.rs builds the bindgen wrappers as clang LTO objects when `clang` is on PATH
      # and CC is unset; CC=gcc selects its plain fallback. The fallback adds -march=native, which
      # would bake the runner's CPU into a cached target directory; CFLAGS comes last and wins.
      CC: gcc
      CFLAGS: -march=x86-64-v2
    steps:
      - uses: actions/checkout@v7

      # Pinned so a new stable release (clippy lints, rustfmt changes) cannot turn CI red on an
      # unchanged tree; bump together with dpds-core's rust-version note.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      # First: needs neither DPDK nor the build cache, so a formatting slip fails in seconds.
      - name: Format
        run: cargo fmt --all -- --check

      # libclang-dev: bindgen. libnuma-dev: DPDK refuses to build for several NUMA nodes without
      # it (platform=generic). libpcap-dev: libdpdk.pc requires libpcap, and the net_pcap vdev of
      # the e2e tests links it. The rest is only needed to build DPDK on a cache miss.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libnuma-dev libpcap-dev pkg-config meson ninja-build python3-pyelftools

      # The Ubuntu 24.04 package is DPDK 23.11 (25.11 on 26.04); dpdk-sys needs at least 26.07, so
      # DPDK is built from the release tarball. The install is cached on the hash of the script,
      # which holds the version and all build options.
      - name: Restore DPDK
        id: dpdk-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/dpdk
          key: dpdk-ubuntu-24.04-${{ hashFiles('.github/scripts/install-dpdk.sh') }}
      - name: Build DPDK
        if: steps.dpdk-cache.outputs.cache-hit != 'true'
        run: .github/scripts/install-dpdk.sh "$HOME/dpdk"
      # Saved right after the build, not at the end of the job: red tests must not cost a DPDK
      # build on every rerun.
      - name: Save DPDK
        if: steps.dpdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/dpdk
          key: ${{ steps.dpdk-cache.outputs.cache-primary-key }}
      - name: Use DPDK
        run: |
          echo "PKG_CONFIG_PATH=$HOME/dpdk/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/dpdk/lib" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `telemetry` (crate dpds) is the only feature that changes code paths, the others of
      # dpds-core are on by default. All features is a second pass over the telemetry code.
      - name: Clippy, all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # --release as in docs/DEVELOPMENT.md ("Testing"): the controller's e2e tests need a
      # release `dpds` anyway, and the e2e timings are meant for the release profile.
      # --no-fail-fast reports every failing test binary, not just the first.
      # The dpds e2e tests start the real binary on net_null/net_pcap vdevs without root or
      # hugepages. They need up to 4 CPUs (`-l 0-3`) and serialise themselves with a lock.
      # A test that would skip for lack of something in its environment fails instead when CI is
      # set (GitHub sets it), so every step below must provide what its tests need. The dpds
      # memlock tests need a hard RLIMIT_MEMLOCK they can raise a child to (unlimited); prlimit
      # lifts it for this shell and so for cargo and the tests it starts.
      - name: Test
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test --workspace --release --no-fail-fast
      - name: Test dpds with telemetry
        run: |
          sudo prlimit --pid $$ --memlock=unlimited:unlimited
          cargo test -p dpds --release --features telemetry --no-fail-fast
      # The controller's end-to-end tests are #[ignore]d: they supervise a real `dpds` with
      # telemetry, so that binary is built first. They run one at a time.
      - name: Build dpds with telemetry
        run: cargo build --release -p dpds --features telemetry
      # Unlike the dpds e2e tests, the controller passes no `--no-huge`, so its `dpds` needs real
      # hugepages. The test links use 4096-mbuf buffers (a few
      # tens of MiB per link); 1 GiB of 2 MiB pages covers the three-link ring with headroom.
      # `--in-memory` maps them anonymously, so no hugetlbfs write access (root) is needed.
      - name: Reserve hugepages
        run: |
          sudo sysctl -w vm.nr_hugepages=512
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 512
      - name: Test controller end-to-end
        run: cargo test --release -p dpds-controller --test integration -- --ignored --test-threads=1 --skip e2e::virtual_network
      # The virtual network mode runs dpds on net_af_packet over veth pairs and network namespaces,
      # which need root (CAP_NET_ADMIN, CAP_NET_RAW, CAP_SYS_ADMIN) and no hugepages. The test
      # binary is built as the user (nothing is rebuilt as root), then run under sudo, which resets
      # the environment: PATH, LD_LIBRARY_PATH (DPDK) and CI (skips fail) are passed explicitly.
      # The step above skips these tests, it runs as the user.
      - name: Test controller end-to-end in a virtual network
        run: |
          bin="$(cargo test --release -p dpds-controller --test integration --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "integration") | .executable' | tail -n 1)"
          test -x "$bin"
          sudo env "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" "CI=$CI" "$bin" e2e::virtual_network --ignored --test-threads=1

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Node 26; package.json requires >= 26.0.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      # The build dpds.sh install and update run on the host.
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Plain bash with stubbed cargo/curl/systemctl; no root or real systemd needed.
      - run: bash packaging/tests/dpds_sh.test.sh

  # The only job with write access: it tags and releases the version in VERSION.md once it is on
  # main and every check above passed. A version that already has its tag is left alone, so
  # ordinary merges into main do nothing. The release has generated notes and no build assets.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Create the release for VERSION.md
        run: |
          IFS= read -r line < VERSION.md || true
          if [[ ! $line =~ ^[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$ ]]; then
            echo "VERSION.md must start with X.Y.Z, found: $line" >&2
            exit 1
          fi
          tag="v${BASH_REMATCH[1]}"
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "$tag exists, nothing to release."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes \
            --title "DPDS $tag" --repo "$GITHUB_REPOSITORY"
